name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build & attach binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          swiftc -O dsh-ui.swift -o dsh-ui
          ./dsh-ui --help > /dev/null
          shasum -a 256 dsh-ui > dsh-ui.sha256
          cat dsh-ui.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dsh-ui dsh-ui.sha256 --clobber
